name: Build chiaki-ng Windows x86_64 (MSYS2)

on:
  workflow_dispatch:

jobs:
  build-win_x64:
    name: Build chiaki-ng win_x64 (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout source (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git make unzip zip
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python protobuf
        run: |
          python -m pip install --upgrade pip
          python -m pip install protobuf

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup FFmpeg
        run: |
          curl -fL --retry 3 --retry-delay 2 -o ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip -q ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin/
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include/
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib/

      - name: Build SDL2 compatibility layer
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Apply repository patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy portable Windows package
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${GITHUB_WORKSPACE}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Package portable build
        run: |
          CHIAKI_VERSION_MAJOR="$(grep -E 'set\(CHIAKI_VERSION_MAJOR [0-9]+' CMakeLists.txt | grep -Eo '[0-9]+')"
          CHIAKI_VERSION_MINOR="$(grep -E 'set\(CHIAKI_VERSION_MINOR [0-9]+' CMakeLists.txt | grep -Eo '[0-9]+')"
          CHIAKI_VERSION_PATCH="$(grep -E 'set\(CHIAKI_VERSION_PATCH [0-9]+' CMakeLists.txt | grep -Eo '[0-9]+')"
          RELEASE_PACKAGE_FILE="chiaki-ng-win_x64-MSYS2-portable-${CHIAKI_VERSION_MAJOR}.${CHIAKI_VERSION_MINOR}.${CHIAKI_VERSION_PATCH}-custom-${GITHUB_SHA}.zip"
          zip -qr "$RELEASE_PACKAGE_FILE" chiaki-ng-Win
          echo "RELEASE_PACKAGE_PATH=${RELEASE_PACKAGE_FILE}" >> "$GITHUB_ENV"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-MSYS2-portable
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7
